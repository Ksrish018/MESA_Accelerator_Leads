<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Funding Outreach Components Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #ffffff; font-family: Inter, "Segoe UI", Arial, sans-serif; color: #13294B; }
  .wrap { max-width: 1820px; margin: 0 auto; padding: 8px 12px 24px; }
  svg { width: 100%; height: auto; display: block; }
  .box { box-sizing: border-box; width: 100%; height: 100%; border: 2px solid; border-radius: 10px;
         display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
         padding: 8px 12px; gap: 5px; }
  .box b { font-size: 15.5px; font-weight: 600; line-height: 1.25; }
  .box span { font-size: 13px; line-height: 1.35; }
  .badge { font-size: 11px !important; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
           background: #E0612F; color: #fff; padding: 2px 8px; border-radius: 999px; }
  .trig { background: #E4E2FB; border-color: #5B54D6; color: #26215C; }
  .ai   { background: #FDE4EF; border-color: #D9468A; color: #5A1534; }
  .ctx  { background: #E3F6E5; border-color: #3FAE56; color: #173F1F; }
  .proc { background: #FFF1CC; border-color: #E8A317; color: #4A3300; }
  .hum  { background: #FFE2D6; border-color: #E0612F; color: #5A2410; border-width: 2.5px; }
  .mail { background: #E3EEFC; border-color: #2F6FD6; color: #0C2F66; }
  .out  { background: #FDE3E1; border-color: #E2483D; color: #5E1611; }
</style>
</head>
<body>
<div class="wrap">
<svg id="map" viewBox="0 0 1820 1250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Components map for the Timed Funding Outreach Engine">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#1F3A5F"/>
    </marker>
  </defs>
  <g id="bg"></g>
  <g id="arrows"></g>
  <g id="boxes"></g>
</svg>
</div>
<script>
const NS = "http://www.w3.org/2000/svg";
const X0 = 215, CW = 265, Y0 = 155, LH = 170, BW = 236, BH = 134;
const cols = ["Trigger", "Input", "Context", "Processing", "AI", "Output"];
const lanes = [
  ["Rohit", "(Programme lead)", "#FFF1E8"],
  ["Gmail", "(Rohit's Drafts folder)", "#FDEEF4"],
  ["Supabase", "(Database)", "#EEF9F0"],
  ["System", "(App on Vercel)", "#FFFBEA"],
  ["Gemini Flash", "(LLM)", "#F7EEFA"],
  ["Live sources", "(Free, public)", "#E9F1FD"]
];
const cx = c => X0 + CW * (c - 1) + CW / 2;
const cy = l => Y0 + LH * (l - 1) + LH / 2;

// [lane, column, style, badge, title, detail]
const boxes = {
  S1: [4, 1, "trig", "", "Every morning, 6 am IST", "Vercel Cron starts the run. A “Run now” button does the same on demand"],
  N1: [6, 2, "mail", "", "Funding news from the last 24 hours", "Entrackr, YourStory, Inc42, Google News (trusted outlets only), PR Newswire, TechCrunch"],
  H1: [1, 3, "hum", "Human judgment", "Rohit owns the thesis", "Edits sectors, stage, cheque size and exclusions in Supabase. The next run follows it, no code change"],
  D1: [3, 3, "ctx", "", "Thesis and contact history", "The current thesis version, plus every company ever drafted, sent or skipped"],
  G1: [5, 4, "ai", "", "Reads each article", "Is this a new pre-seed or seed round? Company, amount, date, investors, founders, each with a quote"],
  S2: [4, 4, "proc", "", "Checks facts, removes repeats", "Quotes must match the article. Merges outlets on one round. Skips anyone already contacted or past the window"],
  N2: [6, 5, "mail", "", "The startup's own website", "What they do, in their words. A contact only if they publish one"],
  G2: [5, 5, "ai", "", "Scores fit and drafts the email", "One reason per thesis criterion. The email uses only checked facts. A contact is never guessed"],
  H3: [1, 5, "hum", "Human check", "Spot-checks “Filtered out”", "Every startup turned away is listed with its reason. One click rescues it while the window is open"],
  S3: [4, 6, "out", "", "Morning queue, ranked by fit", "Each startup with its sources, fit reasons and days left in the window"],
  H2: [1, 6, "hum", "Human judgment", "Reads, edits, approves", "About 2 minutes each. The system never sends anything"],
  M1: [2, 6, "mail", "", "Draft waits in Gmail", "Created only on Approve. Rohit presses Send himself"],
  D2: [3, 6, "ctx", "", "Records every outreach", "Drafted or sent, by company. Later runs never draft them again"]
};

const box = id => { const [l, c] = boxes[id]; const x = cx(c) - BW / 2, y = cy(l) - BH / 2;
  return { x, y, r: x + BW, b: y + BH, mx: cx(c), my: cy(l) }; };
const R = (id, dy = 0) => [box(id).r, box(id).my + dy];
const L = (id, dy = 0) => [box(id).x, box(id).my + dy];
const T = (id, dx = 0) => [box(id).mx + dx, box(id).y];
const B = (id, dx = 0) => [box(id).mx + dx, box(id).b];
const viaX = (a, b, x) => [a, [x, a[1]], [x, b[1]], b];
const vFirst = (a, b) => [a, [a[0], b[1]], b];

const arrows = [
  vFirst(B("S1"), L("N1")),                 // cron fetches the news
  viaX(R("N1"), L("G1"), 745),              // articles to Gemini
  [T("G1"), B("S2")],                       // extracted facts back to the system
  [B("H1"), T("D1")],                       // Rohit edits the thesis
  viaX(R("D1", -20), L("S2"), 1010),        // thesis + history into the checks
  viaX(R("S2"), L("N2"), 1275),             // fetch the startup's website
  [T("N2"), B("G2")],                       // website text to Gemini
  vFirst(T("G2", 40), L("S3")),             // fits into the morning queue
  [T("G2", -40), B("H3", -40)],             // non-fits into "Filtered out"
  [R("S3"), [1802, R("S3")[1]], [1802, R("H2")[1]], R("H2")], // queue to Rohit
  [B("H2"), T("M1")],                       // approve creates the Gmail draft
  viaX(L("H2", 30), L("D2", -20), 1540),    // outreach recorded
  [L("D2", 25), R("D1", 25)]                // history feeds tomorrow's dedupe
];

function el(tag, attrs, parent, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text) e.textContent = text;
  parent.appendChild(e); return e;
}
const bg = document.getElementById("bg"), ar = document.getElementById("arrows"), bx = document.getElementById("boxes");

el("text", { x: 910, y: 52, "text-anchor": "middle", "font-size": 32, "font-weight": 700, fill: "#13294B" }, bg,
   "Final · Timed Funding Outreach Engine — Components Map");
el("rect", { x: 20, y: 85, width: 1785, height: 70, rx: 10, fill: "#13294B" }, bg);
el("text", { x: 117, y: 128, "text-anchor": "middle", "font-size": 21, "font-weight": 500, fill: "#fff" }, bg, "Actor");
cols.forEach((c, i) => el("text", { x: cx(i + 1), y: 128, "text-anchor": "middle", "font-size": 21, "font-weight": 500, fill: "#fff" }, bg, c));
lanes.forEach(([name, sub, color], i) => {
  const y = Y0 + LH * i;
  el("rect", { x: X0, y, width: CW * 6 - 10, height: LH, fill: color }, bg);
  el("rect", { x: 20, y, width: 195, height: LH, fill: "#13294B" }, bg);
  el("line", { x1: 20, y1: y, x2: 1805, y2: y, stroke: "#ffffff", "stroke-width": 2 }, bg);
  el("text", { x: 117, y: y + LH / 2 - 4, "text-anchor": "middle", "font-size": 20, "font-weight": 600, fill: "#fff" }, bg, name);
  el("text", { x: 117, y: y + LH / 2 + 22, "text-anchor": "middle", "font-size": 15, fill: "#C9D3E6" }, bg, sub);
});
for (let i = 1; i < 6; i++) el("line", { x1: X0 + CW * i, y1: Y0, x2: X0 + CW * i, y2: Y0 + LH * 6, stroke: "#ffffff", "stroke-width": 2 }, bg);

arrows.forEach(pts => el("polyline", { points: pts.map(p => p.join(",")).join(" "), fill: "none", stroke: "#1F3A5F",
  "stroke-width": 1.8, "stroke-dasharray": "6 5", "marker-end": "url(#ah)" }, ar));

for (const id in boxes) {
  const [, , cls, badge, title, sub] = boxes[id]; const g = box(id);
  const fo = el("foreignObject", { x: g.x, y: g.y, width: BW, height: BH }, bx);
  fo.innerHTML = `<div xmlns="http://www.w3.org/1999/xhtml" class="box ${cls}">${badge ? `<span class="badge">${badge}</span>` : ""}<b>${title}</b><span>${sub}</span></div>`;
}

const ly = Y0 + LH * 6 + 38;
el("rect", { x: 20, y: ly - 18, width: 26, height: 22, rx: 5, fill: "#FFE2D6", stroke: "#E0612F", "stroke-width": 2.5 }, bg);
el("text", { x: 56, y: ly, "font-size": 15, fill: "#13294B" }, bg, "Orange = human judgment point (AI does not decide)");
el("line", { x1: 470, y1: ly - 6, x2: 520, y2: ly - 6, stroke: "#1F3A5F", "stroke-width": 1.8, "stroke-dasharray": "6 5", "marker-end": "url(#ah)" }, bg);
el("text", { x: 532, y: ly, "font-size": 15, fill: "#13294B" }, bg, "Flow of a funding announcement");
el("text", { x: 790, y: ly, "font-size": 15, fill: "#5A6B85" }, bg,
   "Scope: India + global press releases. All AI steps use Gemini Flash. The system drafts; it never sends.");
</script>
</body>
</html>
